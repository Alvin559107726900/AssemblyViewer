<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>組裝動畫檢視器</title>
<style>
  :root { color-scheme: light; }
  body { font-family: system-ui, "Noto Sans TC", sans-serif; margin: 0; background: #f4f5f7; }
  #banner { background: #a32d2d; color: #fff; padding: 6px 16px; font-size: 14px; display: none; }
  header { padding: 16px 20px 0; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  main { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px 20px 32px; }
  #stage-wrap { flex: 1 1 520px; min-width: 320px; }
  #stage {
    width: 100%; aspect-ratio: 4 / 3; background: #1b1e24; border-radius: 8px;
    position: relative; overflow: hidden;
  }
  #stage canvas { display: block; width: 100%; height: 100%; }
  #fallback {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    color: #eee; text-align: center; padding: 24px; font-size: 14px;
  }
  /* 座標軸小工具:固定在畫面左上角,大小不隨模型縮放或鏡頭拉近拉遠改變,
     只會隨著滑鼠拖曳旋轉視角而跟著轉,方向永遠對應目前的視角。 */
  #axis-gizmo {
    position: absolute; left: 8px; top: 8px; width: 100px; height: 100px;
    background: rgba(0,0,0,0.35); border-radius: 6px; overflow: hidden;
  }
  #controls { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  #controls button {
    padding: 6px 14px; border-radius: 6px; border: 1px solid #999; background: #fff; cursor: pointer;
  }
  #controls button:hover { background: #eee; }
  #scrub { flex: 1 1 160px; min-width: 120px; }
  #controls label { font-size: 14px; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  #step-readout { font-size: 13px; color: #555; min-width: 88px; }
  #panel { flex: 1 1 360px; min-width: 280px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; background: #fff; }
  td, th { border: 1px solid #ddd; padding: 5px 8px; text-align: left; }
  th { background: #eef0f3; }
  tr.active td { background: #fff4d6; }
  tr.clickable { cursor: pointer; }
  #note-line { font-size: 12px; color: #777; margin-top: 20px; }
</style>
</head>
<body>
<div id="banner"></div>
<div id="error-box" style="display:none; background:#fff3cd; color:#664d03; border-bottom:1px solid #ffe69c; padding:10px 16px; font-size:13px; white-space:pre-wrap;"></div>
<header>
  <h1 id="title"></h1>
</header>
<main>
  <div id="stage-wrap">
    <div id="stage">
      <div id="fallback">這個瀏覽器不支援 WebGL,暫時無法顯示 3D 組裝動畫。<br>請改用 Chrome、Edge 或 Firefox 的較新版本開啟本檔案。</div>
    <div id="axis-gizmo"></div>
    </div>
    <div id="controls">
      <button id="btn-play">播放</button>
      <button id="btn-reset">重置</button>
      <input type="range" id="scrub" min="0" max="1000" value="0">
      <span id="step-readout">步驟 0 / 0</span>
      <label><input type="checkbox" id="chk-rotate"> 自動旋轉</label>
      <label><input type="checkbox" id="chk-follow" checked> 轉向當前零件</label>
    </div>
  </div>
  <div id="panel">
    <table id="parts"></table>
    <p id="note-line">點擊表格中的一列,可以在 3D 畫面中反白對應的零件。</p>
  </div>
</main>

<!--__VENDOR__-->

<script>
/*__DATA__*/
</script>

<script>
// ---------------------------------------------------------------
// 基礎版「逐步組裝」動畫檢視器(不是爆炸圖)
// 讀取 DATA.parts / DATA.meshes / DATA.project,不假設任何寫死的零件資料。
// 每個零件依 step 由小到大,依序從 explode_dir/explode_dist 指定的方向飛入定位,
// 裝好後就留在畫面上,直到全部零件都組裝完成。
// 功能:播放、進度拖曳(scrub)、自動旋轉、點擊零件反白、WebGL 偵測。
// 之後要加逐步模式細節說明、平移功能等,直接在這個檔案裡擴充即可。
// ---------------------------------------------------------------

try {

document.title = (DATA.project.name || "組裝動畫") + " 組裝動畫檢視器";
document.getElementById("title").textContent = DATA.project.name || "";
if (DATA.project.confidential) {
  const b = document.getElementById("banner");
  b.textContent = DATA.project.confidential + " | " + DATA.project.built;
  b.style.display = "block";
}

// --- 零件表格 -----------------------------------------------------
const tableEl = document.getElementById("parts");
tableEl.innerHTML = "<tr><th>步驟</th><th>零件</th><th>P/N</th><th>工具</th><th>扭力</th><th>注意事項</th></tr>" +
  DATA.parts.map((p, i) =>
    `<tr class="clickable" data-idx="${i}"><td>${p.step}</td><td>${p.part_name}</td><td>${p.pn}</td><td>${p.tool}</td><td>${p.torque}</td><td>${p.note}</td></tr>`
  ).join("");

// --- WebGL 偵測 -----------------------------------------------------
function hasWebGL() {
  try {
    const c = document.createElement("canvas");
    return !!(window.WebGLRenderingContext && (c.getContext("webgl") || c.getContext("experimental-webgl")));
  } catch (e) { return false; }
}
if (!hasWebGL()) {
  document.getElementById("fallback").style.display = "flex";
} else {
  initViewer();
}

// --- 最小 STL 解析器(支援二進位與 ASCII,不依賴 three.js 的模組版 STLLoader)---
function parseSTL(buffer) {
  const view = new DataView(buffer);
  // 判斷二進位格式:80 bytes header + 4 bytes 三角形數 + 50 bytes * N
  if (buffer.byteLength >= 84) {
    const triCount = view.getUint32(80, true);
    if (84 + triCount * 50 === buffer.byteLength) {
      return parseBinarySTL(view, triCount);
    }
  }
  // 否則當作 ASCII
  return parseAsciiSTL(new TextDecoder().decode(buffer));
}

function parseBinarySTL(view, triCount) {
  const positions = new Float32Array(triCount * 9);
  const normals = new Float32Array(triCount * 9);
  let offset = 84;
  for (let i = 0; i < triCount; i++) {
    const nx = view.getFloat32(offset, true), ny = view.getFloat32(offset + 4, true), nz = view.getFloat32(offset + 8, true);
    offset += 12;
    for (let v = 0; v < 3; v++) {
      const base = i * 9 + v * 3;
      positions[base] = view.getFloat32(offset, true);
      positions[base + 1] = view.getFloat32(offset + 4, true);
      positions[base + 2] = view.getFloat32(offset + 8, true);
      normals[base] = nx; normals[base + 1] = ny; normals[base + 2] = nz;
      offset += 12;
    }
    offset += 2; // attribute byte count
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  geo.setAttribute("normal", new THREE.BufferAttribute(normals, 3));
  return geo;
}

function parseAsciiSTL(text) {
  const positions = [];
  const vertexRe = /vertex\s+([\d.eE+-]+)\s+([\d.eE+-]+)\s+([\d.eE+-]+)/g;
  let m;
  while ((m = vertexRe.exec(text)) !== null) {
    positions.push(parseFloat(m[1]), parseFloat(m[2]), parseFloat(m[3]));
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(positions), 3));
  geo.computeVertexNormals();
  return geo;
}

function base64ToBuffer(b64) {
  const bin = atob(b64);
  const buf = new ArrayBuffer(bin.length);
  const arr = new Uint8Array(buf);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return buf;
}

// --- 主流程 -----------------------------------------------------
function initViewer() {
  const stage = document.getElementById("stage");
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1b1e24);
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100000);

  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const dir1 = new THREE.DirectionalLight(0xffffff, 0.8);
  dir1.position.set(1, 2, 3);
  scene.add(dir1);
  const dir2 = new THREE.DirectionalLight(0xffffff, 0.4);
  dir2.position.set(-2, -1, -1);
  scene.add(dir2);

  const group = new THREE.Group();
  scene.add(group);

  // 依零件順序建立 mesh,並記錄各自的原始位置(assembled position)
  const items = []; // { mesh, assembledPos, explodeDir, explodeDist, step, delay, row }
  const rows = Array.from(document.querySelectorAll("#parts tr[data-idx]"));

  DATA.parts.forEach((p, i) => {
    const b64 = DATA.meshes[p.stl_file];
    if (!b64) return; // 找不到對應幾何,略過(理論上 build.py 已檢查過)
    const geo = parseSTL(base64ToBuffer(b64));
    geo.computeBoundingBox();
    const center = new THREE.Vector3();
    geo.boundingBox.getCenter(center);

    const partColor = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(p.color || "") ? p.color : "#8fa8c8";
    const mat = new THREE.MeshStandardMaterial({ color: new THREE.Color(partColor), metalness: 0.1, roughness: 0.7 });
    const mesh = new THREE.Mesh(geo, mat);
    group.add(mesh);

    items.push({
      mesh, center,
      explodeDir: (p.explode_dir || "").toLowerCase(),
      explodeDist: parseFloat(p.explode_distance || p.explode_dist) || 0,
      step: p.step,
      delay: parseFloat(p.delay) || 0,
      row: rows[i],
    });
  });

  // 整體組裝中心,給沒填 explode_dir 的零件用來自動決定爆炸方向
  const overallBox = new THREE.Box3().setFromObject(group);
  const overallCenter = new THREE.Vector3();
  overallBox.getCenter(overallCenter);
  const overallSize = new THREE.Vector3();
  overallBox.getSize(overallSize);
  const AUTO_EXPLODE_DIST = Math.max(overallSize.length() * 0.15, 10);

  const AXIS = { x: new THREE.Vector3(1, 0, 0), y: new THREE.Vector3(0, 1, 0), z: new THREE.Vector3(0, 0, 1) };
  items.forEach(it => {
    let dirVec;
    let dist = it.explodeDist;
    const key = it.explodeDir.replace("-", "");
    if (AXIS[key]) {
      dirVec = AXIS[key].clone();
      if (it.explodeDir.startsWith("-")) dirVec.multiplyScalar(-1);
      if (!dist) dist = AUTO_EXPLODE_DIST;
    } else {
      // 自動:從整體中心指向零件中心的方向
      dirVec = it.center.clone().sub(overallCenter);
      if (dirVec.lengthSq() < 1e-6) dirVec = new THREE.Vector3(0, 1, 0);
      dirVec.normalize();
      if (!dist) dist = AUTO_EXPLODE_DIST;
    }
    it.offset = dirVec.multiplyScalar(dist);
  });

  // 相機置中並拉開適當距離
  const fitRadius = Math.max(overallSize.length(), 1);
  camera.position.copy(overallCenter).add(new THREE.Vector3(fitRadius, fitRadius * 0.7, fitRadius));
  camera.lookAt(overallCenter);
  group.position.sub(overallCenter); // 讓組裝中心對齊原點,方便自動旋轉
  camera.position.sub(overallCenter);

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize);
  resize();

  // --- 時間軸:依 step 分組,依序爆炸 ---
  const STEP_DURATION = 700; // 每一步動畫時間(毫秒)
  const stepsSorted = [...new Set(items.map(it => it.step))].sort((a, b) => a - b);
  let cursor = 0;
  const stepStart = {}; // step -> 起始時間(毫秒)
  stepsSorted.forEach(s => {
    const extraDelay = Math.max(...items.filter(it => it.step === s).map(it => it.delay), 0);
    cursor += extraDelay;
    stepStart[s] = cursor;
    cursor += STEP_DURATION;
  });
  const totalDuration = cursor;

  // --- 「轉向當前零件」:每一步預先算好相機該轉到的角度 ---
  // 相機放在零件「飛進來的那一側」並偏向零件所在位置,再往側邊轉一個角度並抬高,
  // 呈現斜 3/4 視角:正在裝的零件在前方、朝著已裝好的組件飛入。
  const VIEW_YAW = 0.6;    // 從飛入方向再往側邊轉的角度(弧度,約 34°)
  const VIEW_ELEV = 1.15;  // 相機的基準極角(弧度,越小越俯視,約抬高 24°)
  const stepView = {};
  stepsSorted.forEach(s => {
    const v = new THREE.Vector3();
    items.filter(it => it.step === s).forEach(it => {
      // 飛入方向 + 零件所在的那一側:兩者相加,相機才會站在零件這一邊,
      // 不會被其他零件擋住(例如徑向卡入的 C 型環,位置在軸的哪一端就從哪一端看)
      v.add(it.offset.clone().normalize());
      const pos = it.center.clone().sub(overallCenter);
      if (pos.length() > fitRadius * 0.03) v.add(pos.normalize());
    });
    if (v.lengthSq() < 1e-6) v.set(0, 1, 0); // 同一步有相反方向的零件時,退回從上方看
    v.normalize();
    stepView[s] = {
      theta: Math.atan2(v.x, v.z) + VIEW_YAW,
      // 上方飛入就多俯視一點、下方飛入就多平視一點,但不要變成正上/正下
      phi: Math.min(Math.max(VIEW_ELEV + (Math.acos(v.y) - Math.PI / 2) * 0.5, 0.7), 1.5),
    };
  });
  let curT = 0, curStep = null;

  const scrub = document.getElementById("scrub");
  const stepReadout = document.getElementById("step-readout");
  scrub.max = String(Math.round(totalDuration));

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  // 組裝動畫(不是爆炸圖):每個零件在還沒輪到它的步驟之前先隱藏,
  // 輪到它時,從 explode_dir/explode_dist 指定的方向飛入,定位到最終組裝位置後就留在畫面上,
  // 不會再飛開。已經裝上的零件會持續疊加,直到全部 10 個步驟都裝完。
  function applyTime(t) {
    let currentStepIndex = 0;
    curT = t;
    curStep = null;
    stepsSorted.forEach(s => { if (t >= stepStart[s]) curStep = s; });
    items.forEach(it => {
      const start = stepStart[it.step];
      if (t < start) {
        it.mesh.visible = false;
        return;
      }
      it.mesh.visible = true;
      const raw = (t - start) / STEP_DURATION;
      const progress = Math.min(Math.max(raw, 0), 1);
      const eased = easeOutCubic(progress);
      // eased: 0(剛開始,還在 offset 位置)→ 1(飛到定位,offset 歸零)
      it.mesh.position.copy(it.offset).multiplyScalar(1 - eased);
      currentStepIndex = stepsSorted.indexOf(it.step) + 1;
    });
    stepReadout.textContent = `步驟 ${currentStepIndex} / ${stepsSorted.length}`;
  }
  applyTime(0);

  // --- 播放控制 ---
  let playing = false, playStart = 0, playFromTime = 0;
  const btnPlay = document.getElementById("btn-play");
  const btnReset = document.getElementById("btn-reset");
  const chkRotate = document.getElementById("chk-rotate");
  const chkFollow = document.getElementById("chk-follow");

  btnPlay.addEventListener("click", () => {
    if (playing) {
      playing = false;
      btnPlay.textContent = "播放";
    } else {
      if (parseFloat(scrub.value) >= totalDuration) scrub.value = "0";
      playFromTime = parseFloat(scrub.value);
      playStart = performance.now();
      playing = true;
      btnPlay.textContent = "暫停";
    }
  });
  btnReset.addEventListener("click", () => {
    playing = false;
    btnPlay.textContent = "播放";
    scrub.value = "0";
    applyTime(0);
  });
  scrub.addEventListener("input", () => {
    playing = false;
    btnPlay.textContent = "播放";
    applyTime(parseFloat(scrub.value));
  });

  // --- 點擊零件列表反白對應零件 ---
  let highlighted = null;
  rows.forEach((row, i) => {
    row.addEventListener("click", () => {
      rows.forEach(r => r.classList.remove("active"));
      row.classList.add("active");
      if (highlighted) highlighted.mesh.material.emissive.setHex(0x000000);
      const it = items[i];
      if (it) {
        it.mesh.material.emissive = it.mesh.material.emissive || new THREE.Color(0);
        it.mesh.material.emissive.setHex(0xffcc33);
        highlighted = it;
      }
    });
  });

  // --- 簡易滑鼠拖曳旋轉視角(基礎版,先不做縮放/平移)---
  let dragging = false, lastX = 0, lastY = 0;
  let followPaused = false, lastFollowStep = null;
  let theta = Math.atan2(camera.position.x, camera.position.z);
  let phi = Math.acos(camera.position.y / camera.position.length());
  const baseDist = camera.position.length(); // 全景距離
  let camDist = baseDist;
  const followDist = fitRadius * 1.1;           // 轉向零件時拉近的距離
  function updateCameraFromAngles() {
    camera.position.set(
      camDist * Math.sin(phi) * Math.sin(theta),
      camDist * Math.cos(phi),
      camDist * Math.sin(phi) * Math.cos(theta)
    );
    camera.lookAt(0, 0, 0);
  }
  renderer.domElement.addEventListener("pointerdown", e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
  window.addEventListener("pointerup", () => dragging = false);
  window.addEventListener("pointermove", e => {
    if (!dragging) return;
    followPaused = true; // 使用者自己轉視角時,不要跟他搶,等下一步再自動轉
    theta -= (e.clientX - lastX) * 0.006;
    phi = Math.min(Math.max(phi - (e.clientY - lastY) * 0.006, 0.15), Math.PI - 0.15);
    lastX = e.clientX; lastY = e.clientY;
    updateCameraFromAngles();
  });

  // --- 座標軸小工具(固定在左上角,大小、位置都不受模型縮放影響)---
  // 用一個獨立的小場景+正交相機+獨立 renderer 畫出來,每一影格都同步主相機的角度,
  // 所以旋轉視角時軸的方向會跟著轉,但大小和位置永遠固定在畫面角落。
  const gizmoEl = document.getElementById("axis-gizmo");
  const gizmoSize = 100; // px,固定尺寸
  const gizmoRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  gizmoRenderer.setPixelRatio(window.devicePixelRatio || 1);
  gizmoRenderer.setSize(gizmoSize, gizmoSize, false);
  gizmoRenderer.domElement.style.width = gizmoSize + "px";
  gizmoRenderer.domElement.style.height = gizmoSize + "px";
  gizmoEl.appendChild(gizmoRenderer.domElement);
  const gizmoScene = new THREE.Scene();
  gizmoScene.add(new THREE.AxesHelper(1));
  const gizmoCamera = new THREE.OrthographicCamera(-1.4, 1.4, 1.4, -1.4, 0.1, 10);

  // --- 動畫迴圈 ---
  function tick(now) {
    if (playing) {
      const t = playFromTime + (now - playStart);
      if (t >= totalDuration) {
        applyTime(totalDuration);
        scrub.value = String(totalDuration);
        playing = false;
        btnPlay.textContent = "播放";
      } else {
        applyTime(t);
        scrub.value = String(t);
      }
    }
    if (curStep !== lastFollowStep) { lastFollowStep = curStep; followPaused = false; }
    const view = curStep != null ? stepView[curStep] : null;
    const following = chkFollow.checked && !followPaused && view && curT < totalDuration;
    if (following) {
      // 平滑轉向:角度取最短路徑,每一影格靠近目標一小段
      let dTheta = view.theta - theta;
      dTheta = Math.atan2(Math.sin(dTheta), Math.cos(dTheta));
      theta += dTheta * 0.06;
      phi += (view.phi - phi) * 0.06;
      camDist += (followDist - camDist) * 0.06;
      updateCameraFromAngles();
    } else if (chkRotate.checked) {
      theta += 0.006;
      updateCameraFromAngles();
    }
    // 沒有正在跟隨的零件(重置或全部裝完)時,慢慢拉回全景距離
    if (!following && chkFollow.checked && !followPaused && (curStep == null || curT >= totalDuration)
        && Math.abs(camDist - baseDist) > 0.5) {
      camDist += (baseDist - camDist) * 0.06;
      updateCameraFromAngles();
    }
    renderer.render(scene, camera);

    gizmoCamera.position.set(
      Math.sin(phi) * Math.sin(theta),
      Math.cos(phi),
      Math.sin(phi) * Math.cos(theta)
    ).multiplyScalar(3);
    gizmoCamera.lookAt(0, 0, 0);
    gizmoCamera.up.copy(camera.up);
    gizmoRenderer.render(gizmoScene, gizmoCamera);

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

} catch (err) {
  console.error(err);
  const box = document.getElementById("error-box");
  box.style.display = "block";
  box.textContent = "檢視器發生錯誤,請把這段訊息截圖給協助你的人:\n" + (err && err.stack ? err.stack : err);
}
</script>
</body>
</html>
